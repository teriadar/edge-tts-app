name: Feature Request
description: Suggest an improvement or new feature for Nuvola Reader
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Feature Description
      description: Describe the feature or improvement you would like to see.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Use Case / Motivation
      description: Why would this feature be useful for reading or listening to EPUB books?
    validations:
      required: false
